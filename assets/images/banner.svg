<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a1a"/>
      <stop offset="45%" stop-color="#0a1734"/>
      <stop offset="75%" stop-color="#122a52"/>
      <stop offset="100%" stop-color="#1b3a63"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c451" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#f0a63a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f0a63a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>

    <linearGradient id="trailFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5c451" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f5c451" stop-opacity="1"/>
    </linearGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- fondo cósmico -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- estrellas -->
  <g fill="#ffffff">
    <circle cx="60" cy="55" r="1.4" opacity="0.8"/>
    <circle cx="140" cy="120" r="1" opacity="0.5"/>
    <circle cx="230" cy="40" r="1.6" opacity="0.7"/>
    <circle cx="320" cy="90" r="1" opacity="0.4"/>
    <circle cx="410" cy="30" r="1.2" opacity="0.6"/>
    <circle cx="90" cy="200" r="1" opacity="0.5"/>
    <circle cx="180" cy="260" r="1.3" opacity="0.6"/>
    <circle cx="70" cy="330" r="1" opacity="0.4"/>
    <circle cx="1000" cy="60" r="1.3" opacity="0.7"/>
    <circle cx="1080" cy="140" r="1" opacity="0.5"/>
    <circle cx="950" cy="180" r="1.6" opacity="0.6"/>
    <circle cx="1120" cy="90" r="1" opacity="0.4"/>
    <circle cx="1150" cy="230" r="1.2" opacity="0.5"/>
    <circle cx="870" cy="50" r="1" opacity="0.5"/>
    <circle cx="1040" cy="300" r="1.1" opacity="0.4"/>
    <circle cx="500" cy="60" r="1" opacity="0.5"/>
    <circle cx="620" cy="40" r="1.3" opacity="0.6"/>
    <circle cx="700" cy="90" r="1" opacity="0.4"/>
    <circle cx="780" cy="50" r="1.2" opacity="0.5"/>
    <circle cx="40" cy="450" r="1" opacity="0.4"/>
    <circle cx="1160" cy="480" r="1.2" opacity="0.5"/>
  </g>

  <!-- viñeta -->
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- resplandor de la "migaja" objetivo -->
  <circle cx="1030" cy="470" r="130" fill="url(#glow)"/>
  <circle cx="1030" cy="470" r="7" fill="#fff6df"/>

  <!-- rastro de feromona: puntos que se desvanecen hacia el origen -->
  <g>
    <path d="M 120 250 C 300 320, 420 480, 620 460 S 880 430, 1030 470"
          fill="none" stroke="url(#trailFade)" stroke-width="2.5"
          stroke-dasharray="1 14" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- el punto se transforma en trazos de circuito hacia el origen -->
  <g stroke="#5eead4" stroke-width="2" fill="none" opacity="0.55">
    <path d="M 120 250 H 175 V 210 H 230"/>
    <circle cx="175" cy="250" r="3" fill="#5eead4" stroke="none"/>
    <circle cx="230" cy="210" r="3" fill="#5eead4" stroke="none"/>
    <path d="M 120 250 V 300 H 60"/>
    <circle cx="120" cy="300" r="3" fill="#5eead4" stroke="none"/>
    <circle cx="60" cy="300" r="3" fill="#5eead4" stroke="none"/>
  </g>

  <!-- siluetas de hormigas sobre el rastro -->
  <g fill="#0a0b1e" stroke="#f5c451" stroke-width="1">
    <!-- hormiga 1 -->
    <g transform="translate(260,330) rotate(15) scale(1.1)">
      <ellipse cx="0" cy="0" rx="5" ry="3.2"/>
      <ellipse cx="-8" cy="-1" rx="3.4" ry="2.4"/>
      <ellipse cx="7" cy="1" rx="4.2" ry="2.8"/>
      <line x1="0" y1="0" x2="-6" y2="7" stroke-width="0.8"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke-width="0.8"/>
      <line x1="0" y1="0" x2="6" y2="7" stroke-width="0.8"/>
    </g>
    <!-- hormiga 2 -->
    <g transform="translate(430,400) rotate(-10) scale(1.3)">
      <ellipse cx="0" cy="0" rx="5" ry="3.2"/>
      <ellipse cx="-8" cy="-1" rx="3.4" ry="2.4"/>
      <ellipse cx="7" cy="1" rx="4.2" ry="2.8"/>
      <line x1="0" y1="0" x2="-6" y2="7" stroke-width="0.8"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke-width="0.8"/>
      <line x1="0" y1="0" x2="6" y2="7" stroke-width="0.8"/>
    </g>
    <!-- hormiga 3 -->
    <g transform="translate(700,455) rotate(6) scale(1.15)">
      <ellipse cx="0" cy="0" rx="5" ry="3.2"/>
      <ellipse cx="-8" cy="-1" rx="3.4" ry="2.4"/>
      <ellipse cx="7" cy="1" rx="4.2" ry="2.8"/>
      <line x1="0" y1="0" x2="-6" y2="7" stroke-width="0.8"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke-width="0.8"/>
      <line x1="0" y1="0" x2="6" y2="7" stroke-width="0.8"/>
    </g>
    <!-- hormiga 4, cerca de la meta -->
    <g transform="translate(880,440) rotate(-4) scale(1.2)">
      <ellipse cx="0" cy="0" rx="5" ry="3.2"/>
      <ellipse cx="-8" cy="-1" rx="3.4" ry="2.4"/>
      <ellipse cx="7" cy="1" rx="4.2" ry="2.8"/>
      <line x1="0" y1="0" x2="-6" y2="7" stroke-width="0.8"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke-width="0.8"/>
      <line x1="0" y1="0" x2="6" y2="7" stroke-width="0.8"/>
    </g>
  </g>

  <!-- texto principal -->
  <text x="70" y="110" font-size="44" fill="#fdf6ec" font-weight="700" font-family="Poppins, sans-serif" letter-spacing="0.2">
    Algoritmos bioinspirados:
  </text>
  <text x="70" y="160" font-size="27" fill="#f5c451" font-weight="300" font-family="Poppins, sans-serif">
    3,800 millones de años de evolución
  </text>
  <text x="70" y="196" font-size="27" fill="#f5c451" font-weight="300" font-family="Poppins, sans-serif">
    comprimidos en un ciclo <tspan font-family="'Courier New', monospace" fill="#5eead4">for</tspan>
  </text>

  <!-- firma / marca -->
  <text x="70" y="580" font-size="20" fill="#c9c3e0" font-family="Poppins, Helvetica, Arial, sans-serif" letter-spacing="1.5">
    ctrl+Science
  </text>
  <rect x="70" y="592" width="46" height="2.5" fill="#f5c451"/>
</svg>
